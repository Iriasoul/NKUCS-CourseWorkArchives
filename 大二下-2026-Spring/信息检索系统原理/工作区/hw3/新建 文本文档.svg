<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ====== LAYER 0: PDF Folder ====== -->
  <rect x="240" y="18" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="34" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">PDF 文件夹</text>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#5F5E5A">./data  ·  os.listdir</text>

  <!-- Arrow: folder → processor -->
  <line x1="340" y1="62" x2="340" y2="78" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ====== LAYER 1: PDF Processor ====== -->
  <rect x="190" y="78" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="98" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">PDF 处理器  pdf_processor.py</text>
  <text x="340" y="118" text-anchor="middle" font-size="11" fill="#534AB7">PyMuPDF 提取全文（标题、年份）停用词过滤</text>

  <!-- Fork left (amber) -->
  <path d="M290 134 L290 152 L125 152 L125 162" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow-amber)"/>
  <!-- Fork right (blue) -->
  <path d="M390 134 L390 152 L555 152 L555 162" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <!-- Fork label -->
  <text x="340" y="149" text-anchor="middle" font-size="10" fill="#888780">索引构建</text>

  <!-- ====== LAYER 2: Two Indexes ====== -->
  <!-- Inverted Index (amber) -->
  <rect x="20" y="162" width="210" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="125" y="183" text-anchor="middle" font-size="13" font-weight="500" fill="#412402">倒排索引</text>
  <text x="125" y="201" text-anchor="middle" font-size="11" fill="#854F0B">word → {doc_id, ...}</text>


  <!-- TF-IDF Matrix (blue) -->
  <rect x="450" y="162" width="210" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="555" y="183" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53">TF-IDF 矩阵</text>
  <text x="555" y="201" text-anchor="middle" font-size="11" fill="#185FA5">|D| × |V|  稀疏矩阵</text>


  <!-- Phase divider -->
  <line x1="40" y1="238" x2="640" y2="238" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="5 4"/>
  <text x="340" y="252" text-anchor="middle" font-size="10" fill="#888780">索引就绪  ·  等待查询</text>

  <!-- ====== LAYER 3: Query Input ====== -->
  <rect x="240" y="260" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">用户输入查询词</text>
  <text x="340" y="296" text-anchor="middle" font-size="11" fill="#534AB7">stdin  ·  过滤项</text>

  <!-- Fork to dual recall -->
  <path d="M290 304 L290 320 L125 320 L125 330" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow-amber)"/>
  <path d="M390 304 L390 320 L555 320 L555 330" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <!-- ====== LAYER 4: Dual Recall ====== -->
  <!-- Sparse (amber) -->
  <rect x="20" y="330" width="210" height="76" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="125" y="350" text-anchor="middle" font-size="13" font-weight="500" fill="#412402">稀疏路  Sparse</text>
  <line x1="24" y1="362" x2="226" y2="362" stroke="#EF9F27" stroke-width="0.4"/>
  <text x="125" y="377" text-anchor="middle" font-size="11" fill="#854F0B">子串 / 前缀匹配</text>
  <text x="125" y="393" text-anchor="middle" font-size="11" fill="#854F0B">编辑距离容错  δ=2</text>

  <!-- Dense (blue) -->
  <rect x="450" y="330" width="210" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="555" y="350" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53">稠密路  Dense</text>
  <line x1="454" y1="362" x2="656" y2="362" stroke="#378ADD" stroke-width="0.4"/>
  <text x="555" y="377" text-anchor="middle" font-size="11" fill="#185FA5">query 向量化</text>
  <text x="555" y="393" text-anchor="middle" font-size="11" fill="#185FA5">余弦相似度  Top-K</text>

  <!-- Rank labels below each path -->
  <text x="125" y="420" text-anchor="middle" font-size="10" fill="#888780">BM25 精排</text>
  <text x="555" y="420" text-anchor="middle" font-size="10" fill="#888780">相似度排序</text>

  <!-- Merge arms into RRF -->
  <path d="M125 406 L125 440 L280 440 L280 450" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow-amber)"/>
  <path d="M555 406 L555 440 L400 440 L400 450" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <!-- ====== LAYER 5: RRF ====== -->
  <rect x="210" y="450" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="470" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">RRF 倒数排序融合</text>
  <text x="340" y="490" text-anchor="middle" font-size="11" fill="#0F6E56">score = 1/(60+r_sparse) + 1/(60+r_dense)</text>

  <line x1="340" y1="506" x2="340" y2="518" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow-teal)"/>

  <!-- ====== LAYER 6: Filter + Output ====== -->
  <rect x="210" y="518" width="260" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="538" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">过滤并输出</text>
  <line x1="214" y1="549" x2="466" y2="549" stroke="#5DCAA5" stroke-width="0.4"/>
  <text x="340" y="563" text-anchor="middle" font-size="11" fill="#0F6E56">文件名 + 片段高亮 + 年份 + 路径</text>

</svg>