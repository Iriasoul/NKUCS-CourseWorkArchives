{% extends 'base.html' %}
{% block title %}我的收藏 - 校园论坛{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h4>我的收藏夹</h4>

        {% for folder in folders %}
        <div class="card mb-2">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ folder.folder_name }}</strong>
                    <span class="text-muted ms-2">{{ folder.post_count }} 篇</span>
                    {% if folder.remark %}
                        <small class="text-muted ms-2">{{ folder.remark }}</small>
                    {% endif %}
                </div>
                <a href="{{ url_for('user.folder_detail', folder_id=folder.folder_id) }}"
                   class="btn btn-sm btn-outline-secondary">查看</a>
            </div>
        </div>
        {% else %}
            <p class="text-muted">还没有收藏夹,来创建一个吧</p>
        {% endfor %}
    </div>

    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h6>新建收藏夹</h6>
                <form method="post" action="{{ url_for('user.create_folder') }}">
                    <div class="mb-2">
                        <input type="text" name="folder_name" class="form-control form-control-sm"
                               placeholder="收藏夹名称" required maxlength="50">
                    </div>
                    <div class="mb-2">
                        <input type="text" name="remark" class="form-control form-control-sm"
                               placeholder="备注(可选)" maxlength="100">
                    </div>
                    <button type="submit" class="btn btn-sm btn-primary">创建</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
