{% extends 'base.html' %}

{% block title %}注册 - 校园论坛{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">注册账号</h2>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" 
                       value="{{ username or '' }}" required minlength="3" maxlength="50">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" 
                       required minlength="6">
            </div>
            <div class="mb-3">
                <label class="form-label" for="user_type">用户类型</label>
                <select id="user_type" name="user_type" class="form-select" required>
                    <option value="">请选择</option>
                    <option value="1">学生</option>
                    <option value="2">老师</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">所属学院(可选)</label>
                <input type="text" name="college" class="form-control" 
                       value="{{ college or '' }}" maxlength="50">
            </div>
            <button type="submit" class="btn btn-primary">注册</button>
            <a href="{{ url_for('auth.login') }}" class="btn btn-link">已有账号?登录</a>
        </form>
    </div>
</div>
{% endblock %}
