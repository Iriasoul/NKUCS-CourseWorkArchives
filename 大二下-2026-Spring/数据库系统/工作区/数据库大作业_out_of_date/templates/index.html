<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园论坛数据库管理后台</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        input, button { margin: 5px 0; padding: 5px; }
    </style>
</head>
<body>
    <h1>数据库工程作业演示系统</h1>

    <div class="card">
        <h3>1. 事务控制下的删除 (删除用户及帖子)</h3>
        <form action="/delete_user" method="post" target="result_frame">
            <input type="number" name="user_id" placeholder="输入要删除的 User ID" required>
            <button type="submit">执行删除</button>
        </form>
    </div>

    <div class="card">
        <h3>2. 触发器控制下的添加 (添加新用户)</h3>
        <form action="/insert_user" method="post" target="result_frame">
            <input type="text" name="username" placeholder="用户名" required>
            <input type="text" name="password" placeholder="密码" required>
            <input type="number" name="user_type" placeholder="类型(1学生/2老师，输其他会报错)" required>
            <button type="submit">执行插入</button>
        </form>
    </div>

    <div class="card">
        <h3>3. 存储过程控制下的更新 (更新帖子)</h3>
        <form action="/update_post" method="post" target="result_frame">
            <input type="number" name="post_id" placeholder="帖子 ID" required>
            <input type="text" name="content" placeholder="新的帖子内容" required>
            <button type="submit">执行更新</button>
        </form>
    </div>

    <div class="card">
        <h3>4. 含有视图的查询操作</h3>
        <form action="/query_view" method="get" target="result_frame">
            <button type="submit">查询视图</button>
        </form>
    </div>

    <h3>执行结果展示：</h3>
    <iframe name="result_frame" style="width: 100%; height: 200px; border: 1px solid #aaa;"></iframe>
</body>
</html>
